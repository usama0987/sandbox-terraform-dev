name: 'Terraform Deploy - Dev Sandbox'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'environments/**'
      - 'modules/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
          - refresh
          - import

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  TERRAFORM_DIR: 'environments/dev-sandbox'
  TF_VAR_force_destroy: 'true'

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ./modules
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Check State File Exists
        id: state_check
        run: |
          if terraform state list > /dev/null 2>&1; then
            echo "state_exists=true" >> $GITHUB_OUTPUT
            echo "Resources found in state file"
          else
            echo "state_exists=false" >> $GITHUB_OUTPUT
            echo "No resources in state file"
          fi
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Comment Format Check Results
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` to fix formatting issues.'
            })

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Check and Import Existing Resources
        id: import_check
        run: |
          # Check if resources exist in AWS but not in state
          set +e
          
          echo "Checking for existing resources..."
          
          # Check ECR Repository
          if aws ecr describe-repositories --repository-names dev-sandbox-repository --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_ecr_repository.main > /dev/null 2>&1; then
              echo "ECR repository exists but not in state - will be handled by refresh"
            fi
          fi
          
          # Check IAM Roles
          if aws iam get-role --role-name dev-sandbox-ecs-task-execution-role > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_iam_role.ecs_task_execution_role > /dev/null 2>&1; then
              echo "Task execution role exists but not in state - will be handled by refresh"
            fi
          fi
          
          # Check VPC
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dev-sandbox-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          if [[ "$VPC_ID" != "None" && "$VPC_ID" != "" ]]; then
            if ! terraform state show module.vpc.aws_vpc.main > /dev/null 2>&1; then
              echo "VPC exists but not in state - will be handled by refresh"
            fi
          fi
          
          set -e
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Refresh
        id: refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan -refresh=true
          terraform show -no-color tfplan > plan_output.txt
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TERRAFORM_DIR }}/tfplan
            ${{ env.TERRAFORM_DIR }}/plan_output.txt
          retention-days: 5

      - name: Comment Plan Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TERRAFORM_DIR }}/plan_output.txt', 'utf8');
            const truncatedOutput = planOutput.length > 65000 ? 
              planOutput.substring(0, 65000) + '\n\n... (output truncated)' : 
              planOutput;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan Results
            
            <details>
            <summary>Show Plan Output</summary>
            
            \`\`\`terraform
            ${truncatedOutput}
            \`\`\`
            
            </details>
            
            **Plan Status:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            **Refresh Status:** ${{ steps.refresh.outcome == 'success' && '✅ Success' || '⚠️ Partial' }}
            
            > 💡 To apply these changes, merge this PR or run the workflow manually with 'apply' action.`
            })

  terraform-refresh:
    name: 'Terraform Refresh'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'refresh'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Show State Status
        run: |
          echo "## 🔄 State Refresh Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Resources in State:" >> $GITHUB_STEP_SUMMARY
          terraform state list >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ env.TERRAFORM_DIR }}

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: |
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: 
      name: dev-sandbox
      url: ${{ steps.apply.outputs.alb_dns_name }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Pre-Apply State Refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: true

      - name: Handle Resource Conflicts
        id: conflict_resolution
        run: |
          # Try to resolve conflicts by checking what exists vs what's in state
          set +e
          
          # Check VPC limit issue - find unused VPCs
          echo "Checking for unused VPCs..."
          aws ec2 describe-vpcs --query 'Vpcs[?State==`available`].[VpcId,Tags[?Key==`Name`].Value|[0]]' --output table
          
          # Check if we can use existing VPC
          EXISTING_VPC=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dev-sandbox-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          if [[ "$EXISTING_VPC" != "None" && "$EXISTING_VPC" != "" ]]; then
            echo "Found existing VPC: $EXISTING_VPC"
            echo "existing_vpc_id=$EXISTING_VPC" >> $GITHUB_OUTPUT
          fi
          
          set -e
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Plan with Refresh
        run: terraform plan -out=tfplan -refresh=true
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -auto-approve tfplan
          
          # Get outputs safely
          if terraform output alb_dns_name > /dev/null 2>&1; then
            echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          else
            echo "alb_dns_name=not-available" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: false

      - name: Output Infrastructure URLs
        run: |
          echo "## 🚀 Infrastructure Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current State:" >> $GITHUB_STEP_SUMMARY
          terraform state list >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if terraform output alb_dns_name > /dev/null 2>&1; then
            echo "### Access URLs:" >> $GITHUB_STEP_SUMMARY
            echo "- **Application URL:** http://$(terraform output -raw alb_dns_name)" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Port Access:** http://$(terraform output -raw alb_dns_name):5000" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Infrastructure Details:" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment:** dev-sandbox" >> $GITHUB_STEP_SUMMARY
            echo "- **Region:** us-east-1" >> $GITHUB_STEP_SUMMARY
            if terraform output ecs_cluster_name > /dev/null 2>&1; then
              echo "- **ECS Cluster:** $(terraform output -raw ecs_cluster_name)" >> $GITHUB_STEP_SUMMARY
            fi
            if terraform output ecr_repository_url > /dev/null 2>&1; then
              echo "- **ECR Repository:** $(terraform output -raw ecr_repository_url)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### Infrastructure Status:" >> $GITHUB_STEP_SUMMARY
            echo "- Resources are being created/updated" >> $GITHUB_STEP_SUMMARY
            echo "- Check individual resource status in AWS Console" >> $GITHUB_STEP_SUMMARY
          fi
        working-directory: ${{ env.TERRAFORM_DIR }}

  terraform-import:
    name: 'Terraform Import Existing Resources'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'import'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Import Existing Resources
        run: |
          # Import ECR Repository if it exists
          if aws ecr describe-repositories --repository-names dev-sandbox-repository --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_ecr_repository.main > /dev/null 2>&1; then
              echo "Importing ECR repository..."
              terraform import module.ecr.aws_ecr_repository.main dev-sandbox-repository || true
            fi
          fi
          
          # Import IAM Roles if they exist
          if aws iam get-role --role-name dev-sandbox-ecs-task-execution-role > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_iam_role.ecs_task_execution_role > /dev/null 2>&1; then
              echo "Importing task execution role..."
              terraform import module.ecr.aws_iam_role.ecs_task_execution_role dev-sandbox-ecs-task-execution-role || true
            fi
          fi
          
          if aws iam get-role --role-name dev-sandbox-ecs-task-role > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_iam_role.ecs_task_role > /dev/null 2>&1; then
              echo "Importing task role..."
              terraform import module.ecr.aws_iam_role.ecs_task_role dev-sandbox-ecs-task-role || true
            fi
          fi
          
          # Import VPC if it exists
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dev-sandbox-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          if [[ "$VPC_ID" != "None" && "$VPC_ID" != "" ]]; then
            if ! terraform state show module.vpc.aws_vpc.main > /dev/null 2>&1; then
              echo "Importing VPC: $VPC_ID"
              terraform import module.vpc.aws_vpc.main $VPC_ID || true
            fi
          fi
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Show Import Results
        run: |
          echo "## 📥 Import Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources now in state:" >> $GITHUB_STEP_SUMMARY
          terraform state list >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ env.TERRAFORM_DIR }}

  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: 
      name: dev-sandbox-destroy
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: true

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -refresh=true
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Destruction Complete
        run: |
          echo "## 🗑️ Infrastructure Destroyed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All resources in the dev-sandbox environment have been destroyed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remaining State:" >> $GITHUB_STEP_SUMMARY
          terraform state list >> $GITHUB_STEP_SUMMARY || echo "State is empty" >> $GITHUB_STEP_SUMMARY
