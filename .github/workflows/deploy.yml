name: 'Terraform Deploy - Dev Sandbox'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'environments/**'
      - 'modules/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
          - refresh
          - import

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  TERRAFORM_DIR: 'environments/dev-sandbox'
  TF_VAR_force_destroy: 'true'

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ./modules
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Check State File Exists
        id: state_check
        run: |
          if terraform state list > /dev/null 2>&1; then
            echo "state_exists=true" >> $GITHUB_OUTPUT
            echo "Resources found in state file"
          else
            echo "state_exists=false" >> $GITHUB_OUTPUT
            echo "No resources in state file"
          fi
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Comment Format Check Results
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Terraform Format Check Failed**\n\nPlease run terraform fmt -recursive to fix formatting issues.'
            })

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Check and Import Existing Resources
        id: import_check
        run: |
          # Check if resources exist in AWS but not in state
          set +e
          
          echo "Checking for existing resources..."
          
          # Check ECR Repository
          if aws ecr describe-repositories --repository-names dev-sandbox-repository --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_ecr_repository.main > /dev/null 2>&1; then
              echo "ECR repository exists but not in state - will be handled by refresh"
            fi
          fi
          
          # Check IAM Roles
          if aws iam get-role --role-name dev-sandbox-ecs-task-execution-role > /dev/null 2>&1; then
            if ! terraform state show module.ecr.aws_iam_role.ecs_task_execution_role > /dev/null 2>&1; then
              echo "Task execution role exists but not in state - will be handled by refresh"
            fi
          fi
          
          # Check VPC
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dev-sandbox-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          if [[ "$VPC_ID" != "None" && "$VPC_ID" != "" ]]; then
            if ! terraform state show module.vpc.aws_vpc.main > /dev/null 2>&1; then
              echo "VPC exists but not in state - will be handled by refresh"
            fi
          fi
          
          set -e
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Refresh
        id: refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan -refresh=true
          terraform show -no-color tfplan > plan_output.txt
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TERRAFORM_DIR }}/tfplan
            ${{ env.TERRAFORM_DIR }}/plan_output.txt
          retention-days: 5

      - name: Comment Plan Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TERRAFORM_DIR }}/plan_output.txt', 'utf8');
            const truncatedOutput = planOutput.length > 65000 ? 
              planOutput.substring(0, 65000) + '\n\n... (output truncated)' : 
              planOutput;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ## 📋 Terraform Plan Results
            
            <details>
            <summary>Show Plan Output</summary>
            
            \\\terraform
            ${truncatedOutput}
            \\\
            
            </details>
            
            **Plan Status:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            **Refresh Status:** ${{ steps.refresh.outcome == 'success' && '✅ Success' || '⚠️ Partial' }}
            
            > 💡 To apply these changes, merge this PR or run the workflow manually with 'apply' action.
            })

  terraform-refresh:
    name: 'Terraform Refresh'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'refresh'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

