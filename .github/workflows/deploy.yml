# .github/workflows/deploy.yml
name: 'Terraform Infrastructure Deployment'

on:
  push:
    branches: 
      - main
      - develop
    paths: 
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/**'
  pull_request:
    branches: 
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
  workflow_dispatch:  # Allows manual triggering
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev-sandbox'
        type: choice
        options:
        - dev-sandbox
        - staging
        - production
      destroy:
        description: 'Destroy infrastructure?'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

env:
  TF_VERSION: '1.5.7'
  AWS_REGION: 'us-east-1'
  TF_WORKING_DIR: 'environments/dev-sandbox'
  S3_BACKEND_BUCKET: 'sandbox-dev-terraform-statefiles'

jobs:
  # Pre-check job to verify S3 bucket exists
  pre-check:
    name: 'Pre-deployment Checks'
    runs-on: ubuntu-latest
    
    steps:
    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        mask-aws-account-id: false

    - name: 'Verify AWS Connection'
      run: |
        echo "🔍 Verifying AWS connection..."
        aws sts get-caller-identity
        echo "✅ AWS connection verified"

    - name: 'Verify S3 Backend Bucket'
      run: |
        echo "🔍 Checking if S3 backend bucket exists..."
        if aws s3api head-bucket --bucket ${{ env.S3_BACKEND_BUCKET }} 2>/dev/null; then
          echo "✅ S3 bucket ${{ env.S3_BACKEND_BUCKET }} exists and is accessible"
          
          # Check versioning status (informational only)
          VERSIONING=$(aws s3api get-bucket-versioning --bucket ${{ env.S3_BACKEND_BUCKET }} --query 'Status' --output text 2>/dev/null || echo "Suspended")
          echo "ℹ️ Bucket versioning status: $VERSIONING"
          
          # Check encryption
          if aws s3api get-bucket-encryption --bucket ${{ env.S3_BACKEND_BUCKET }} >/dev/null 2>&1; then
            echo "✅ Bucket encryption is enabled"
          else
            echo "ℹ️ Bucket encryption is not configured"
          fi
        else
          echo "❌ S3 bucket ${{ env.S3_BACKEND_BUCKET }} does not exist or is not accessible"
          echo "Please create the bucket manually in the AWS Console with the following settings:"
          echo "- Bucket name: ${{ env.S3_BACKEND_BUCKET }}"
          echo "- Region: ${{ env.AWS_REGION }}"
          echo "- Public access: Blocked"
          exit 1
        fi

  # Terraform validation and security checks
  validate:
    name: 'Validate Terraform Configuration'
    runs-on: ubuntu-latest
    needs: pre-check
    
    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v4

    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: 'Terraform Format Check'
      run: |
        echo "🔍 Checking Terraform formatting..."
        terraform fmt -check -recursive
        if [ $? -eq 0 ]; then
          echo "✅ All Terraform files are properly formatted"
        else
          echo "❌ Some files need formatting. Run 'terraform fmt -recursive' locally"
          exit 1
        fi

    - name: 'Terraform Init (Backend=false for validation)'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🚀 Initializing Terraform for validation..."
        terraform init -backend=false

    - name: 'Terraform Validate'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🔍 Validating Terraform configuration..."
        terraform validate
        echo "✅ Terraform configuration is valid"

    - name: 'Security Scan with TFSec'
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        working_directory: ${{ env.TF_WORKING_DIR }}
        soft_fail: true

  # Terraform Plan
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: [pre-check, validate]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    
    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v4

    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        mask-aws-account-id: false

    - name: 'Cache Terraform Providers'
      uses: actions/cache@v3
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-

    - name: 'Terraform Init'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🚀 Initializing Terraform..."
        export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        terraform init -no-color
        echo "✅ Terraform initialized successfully"

    - name: 'Terraform Plan'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "📋 Creating Terraform execution plan..."
        terraform plan -detailed-exitcode -no-color -out=tfplan 2>&1 | tee plan.log
        
        # Save plan exit code
        echo $? > plan_exit_code
        
        # Check if there are changes
        if [ $(cat plan_exit_code) -eq 2 ]; then
          echo "📝 Changes detected in plan"
        elif [ $(cat plan_exit_code) -eq 0 ]; then
          echo "✅ No changes needed"
        else
          echo "❌ Plan failed"
          exit 1
        fi

    - name: 'Upload Plan Artifact'
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan-${{ github.run_number }}
        path: |
          ${{ env.TF_WORKING_DIR }}/tfplan
          ${{ env.TF_WORKING_DIR }}/plan.log
          ${{ env.TF_WORKING_DIR }}/plan_exit_code
        retention-days: 5

    - name: 'Comment PR with Plan'
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = '${{ env.TF_WORKING_DIR }}/plan.log';
          
          if (fs.existsSync(path)) {
            const plan = fs.readFileSync(path, 'utf8');
            const truncatedPlan = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            
            const body = `## 🏗️ Terraform Plan Results
            
            <details>
            <summary>📋 Click to view plan details</summary>
            
            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            > Plan generated for commit: ${{ github.sha }}
            > Workflow run: ${{ github.run_number }}
            `;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const existingComment = comments.data.find(comment => 
              comment.body.includes('🏗️ Terraform Plan Results')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
          }

  # Terraform Apply (Only on main branch push or manual trigger)
  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: [pre-check, validate]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.destroy != 'true')
    environment: 
      name: dev-sandbox
      url: ${{ steps.deploy.outputs.application_url }}
    
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    
    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v4

    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        mask-aws-account-id: false

    - name: 'Cache Terraform Providers'
      uses: actions/cache@v3
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ runner.os }}-terraform-

    - name: 'Terraform Init'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🚀 Initializing Terraform for deployment..."
        export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        terraform init -no-color
        echo "✅ Terraform initialized successfully"

    - name: 'Terraform Apply'
      id: deploy
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🚀 Deploying infrastructure..."
        terraform apply -auto-approve -no-color 2>&1 | tee apply.log
        
        if [ $? -eq 0 ]; then
          echo "✅ Infrastructure deployed successfully!"
          
          # Extract outputs
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "Not available")
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || echo "Not available")
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name 2>/dev/null || echo "Not available")
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "Not available")
          
          echo "application_url=http://$ALB_DNS" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          
          # Create deployment summary
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🎉 Infrastructure Deployment Successful!
          
          ### 🌐 Application Access
          - **Application URL**: http://$ALB_DNS
          - **Health Check**: http://$ALB_DNS/health
          
          ### 📦 Container Registry
          - **ECR Repository**: \`$ECR_URL\`
          
          ### 🏗️ Infrastructure Details
          - **ECS Cluster**: \`$CLUSTER_NAME\`
          - **VPC ID**: \`$VPC_ID\`
          - **Region**: \`${{ env.AWS_REGION }}\`
          - **Environment**: \`dev-sandbox\`
          - **State Backend**: \`s3://${{ env.S3_BACKEND_BUCKET }}/dev-sandbox/terraform.tfstate\`
          
          ### 🔗 Quick AWS Console Links
          - [View ECS Cluster](https://console.aws.amazon.com/ecs/home?region=${{ env.AWS_REGION }}#/clusters/$CLUSTER_NAME)
          - [View Load Balancers](https://console.aws.amazon.com/ec2/home?region=${{ env.AWS_REGION }}#LoadBalancers:)
          - [View ECR Repositories](https://console.aws.amazon.com/ecr/repositories?region=${{ env.AWS_REGION }})
          - [View VPC](https://console.aws.amazon.com/vpc/home?region=${{ env.AWS_REGION }}#vpcs:VpcId=$VPC_ID)
          
          ### 🚀 Next Steps
          1. Build and push your application image to ECR
          2. Update ECS service to deploy your application
          3. Access your application at the URL above
          EOF
          
        else
          echo "❌ Infrastructure deployment failed!"
          exit 1
        fi

    - name: 'Upload Apply Logs'
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: terraform-apply-logs-${{ github.run_number }}
        path: ${{ env.TF_WORKING_DIR }}/apply.log
        retention-days: 30

    - name: 'Generate Application Deployment Script'
      if: success()
      run: |
        cat << 'EOF' > deploy-app.sh
        #!/bin/bash
        # Application Deployment Script
        # Generated automatically by Terraform deployment
        
        set -e
        
        # Configuration
        ECR_URL="${{ steps.deploy.outputs.ecr_repository_url }}"
        CLUSTER_NAME="${{ steps.deploy.outputs.ecs_cluster_name }}"
        REGION="${{ env.AWS_REGION }}"
        
        echo "🚀 Starting application deployment..."
        echo "ECR Repository: $ECR_URL"
        echo "ECS Cluster: $CLUSTER_NAME"
        
        # Login to ECR
        echo "🔐 Logging into ECR..."
        aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URL
        
        # Build application (assumes Dockerfile in current directory)
        echo "🏗️ Building application..."
        docker build -t $ECR_URL:latest .
        
        # Push to ECR
        echo "📤 Pushing to ECR..."
        docker push $ECR_URL:latest
        
        # Update ECS service
        echo "🔄 Updating ECS service..."
        SERVICE_NAME=$(aws ecs list-services --cluster $CLUSTER_NAME --query 'serviceArns[0]' --output text | cut -d'/' -f3)
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service $SERVICE_NAME \
          --force-new-deployment
        
        echo "✅ Application deployment completed!"
        echo "🌐 Application URL: ${{ steps.deploy.outputs.application_url }}"
        EOF
        
        chmod +x deploy-app.sh

    - name: 'Upload Application Deployment Script'
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: application-deployment-script
        path: deploy-app.sh
        retention-days: 30

    - name: 'Notify Deployment Success'
      if: success()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const title = '🎉 Infrastructure Deployment Successful';
          const body = `
          ## Infrastructure Successfully Deployed! 🚀
          
          **🌐 Application URL**: ${{ steps.deploy.outputs.application_url }}
          **📦 ECR Repository**: \`${{ steps.deploy.outputs.ecr_repository_url }}\`
          **🏗️ ECS Cluster**: \`${{ steps.deploy.outputs.ecs_cluster_name }}\`
          **🌐 VPC ID**: \`${{ steps.deploy.outputs.vpc_id }}\`
          
          **📋 Deployment Details:**
          - **Commit**: ${{ github.sha }}
          - **Deployed by**: @${{ github.actor }}
          - **Environment**: dev-sandbox
          - **Region**: ${{ env.AWS_REGION }}
          - **Workflow**: #${{ github.run_number }}
          
          **🔗 Quick Links:**
          - [ECS Console](https://console.aws.amazon.com/ecs/home?region=${{ env.AWS_REGION }}#/clusters/${{ steps.deploy.outputs.ecs_cluster_name }})
          - [ECR Console](https://console.aws.amazon.com/ecr/repositories?region=${{ env.AWS_REGION }})
          - [Load Balancer Console](https://console.aws.amazon.com/ec2/home?region=${{ env.AWS_REGION }}#LoadBalancers:)
          
          **📝 Next Steps:**
          1. Download the \`application-deployment-script\` artifact to deploy your app
          2. Or manually build and push your Docker image to the ECR repository above
          `;
          
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: body
          });

  # Terraform Destroy (Manual trigger only with confirmation)
  destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    needs: [pre-check]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    environment:
      name: destroy-confirmation
    
    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v4

    - name: 'Setup Terraform'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 'Terraform Init'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform init -no-color

    - name: 'Terraform Destroy Plan'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "📋 Creating destruction plan..."
        terraform plan -destroy -no-color 2>&1 | tee destroy-plan.log

    - name: 'Terraform Destroy'
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "🗑️ Destroying infrastructure..."
        terraform destroy -auto-approve -no-color 2>&1 | tee destroy.log
        echo "✅ Infrastructure destroyed successfully"

    - name: 'Upload Destroy Logs'
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: terraform-destroy-logs-${{ github.run_number }}
        path: |
          ${{ env.TF_WORKING_DIR }}/destroy-plan.log
          ${{ env.TF_WORKING_DIR }}/destroy.log
        retention-days: 30

    - name: 'Notify Destruction'
      if: success()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const body = `
          ## 🗑️ Infrastructure Destroyed
          
          All infrastructure resources have been successfully destroyed.
          
          **📋 Details:**
          - **Destroyed by**: @${{ github.actor }}
          - **Environment**: dev-sandbox
          - **Workflow**: #${{ github.run_number }}
          - **Commit**: ${{ github.sha }}
          
          > **Note**: The S3 state bucket \`${{ env.S3_BACKEND_BUCKET }}\` was created manually and remains intact.
          `;
          
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: body
          });
