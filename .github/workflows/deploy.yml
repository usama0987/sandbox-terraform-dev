          fi

          # IAM roles (module.ecr)
          terraform state show module.ecr.aws_iam_role.ecs_task_execution_role >/dev/null 2>&1 || (aws iam get-role --role-name dev-sandbox-ecs-task-execution-role >/dev/null 2>&1 && terraform import -lock=false module.ecr.aws_iam_role.ecs_task_execution_role dev-sandbox-ecs-task-execution-role || true)
          terraform state show module.ecr.aws_iam_role.ecs_task_role >/dev/null 2>&1 || (aws iam get-role --role-name dev-sandbox-ecs-task-role >/dev/null 2>&1 && terraform import -lock=false module.ecr.aws_iam_role.ecs_task_role dev-sandbox-ecs-task-role || true)

          # IAM roles (module.ecs)
          terraform state show 'module.ecs.aws_iam_role.task_execution_role[0]' >/dev/null 2>&1 || (aws iam get-role --role-name dev-sandbox-task-execution-role >/dev/null 2>&1 && terraform import -lock=false 'module.ecs.aws_iam_role.task_execution_role[0]' dev-sandbox-task-execution-role || true)
          terraform state show 'module.ecs.aws_iam_role.task_role[0]' >/dev/null 2>&1 || (aws iam get-role --role-name dev-sandbox-task-role >/dev/null 2>&1 && terraform import -lock=false 'module.ecs.aws_iam_role.task_role[0]' dev-sandbox-task-role || true)

          # Log group
          if aws logs describe-log-groups --log-group-name-prefix "/aws/ecs/dev-sandbox" --query 'logGroups[?logGroupName==`/aws/ecs/dev-sandbox`].logGroupName' --output text | grep -q "/aws/ecs/dev-sandbox"; then
            terraform state show module.ecs.aws_cloudwatch_log_group.ecs_logs >/dev/null 2>&1 || terraform import -lock=false module.ecs.aws_cloudwatch_log_group.ecs_logs "/aws/ecs/dev-sandbox" || true
          fi

          # VPC (avoid VpcLimitExceeded by reusing/importing)
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dev-sandbox-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
          if [[ -n "${VPC_ID}" && "${VPC_ID}" != "None" ]]; then
            terraform state show module.vpc.aws_vpc.main >/dev/null 2>&1 || terraform import -lock=false module.vpc.aws_vpc.main "${VPC_ID}" || true
          fi

