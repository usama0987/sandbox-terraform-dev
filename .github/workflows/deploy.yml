          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Show State Status
        run: |
          echo "## 🔄 State Refresh Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Resources in State:" >> $GITHUB_STEP_SUMMARY
          terraform state list >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ env.TERRAFORM_DIR }}

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: |
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push') ||
