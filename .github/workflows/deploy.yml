  terraform-refresh:
    name: 'Terraform Refresh'
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'refresh'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Auto-Import Existing Resources
        run: |
          set -euo pipefail
          cd "${{ env.TERRAFORM_DIR }}"
          # Reuse same imports as in plan job
          # (kept minimal here for brevity)
          if aws ecr describe-repositories --repository-names dev-sandbox-repository --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            terraform state show module.ecr.aws_ecr_repository.main >/dev/null 2>&1 || terraform import -lock=false module.ecr.aws_ecr_repository.main dev-sandbox-repository || true
          fi

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Show State
        run: terraform state list || true
        working-directory: ${{ env.TERRAFORM_DIR }}

