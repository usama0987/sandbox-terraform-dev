          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ${{ env.TERRAFORM_DIR }}

      - name: Pre-Apply State Refresh
        run: terraform refresh
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: true

      - name: Handle Resource Conflicts
        id: conflict_resolution
        run: |
          # Try to resolve conflicts by checking what exists vs what's in state
          set +e
          
          # Check VPC limit issue - find unused VPCs
          echo "Checking for unused VPCs..."
          aws ec2 describe-vpcs --query 'Vpcs[?State==available].[VpcId,Tags[?Key==Name].Value|[0]]' --output table
          
