        run: |
          cd "${{ env.TERRAFORM_DIR }}"
          terraform plan -refresh-only -no-color -out=refresh.plan || true
          terraform apply -auto-approve refresh.plan || true

      - name: Terraform Plan
        run: |
          cd "${{ env.TERRAFORM_DIR }}"
          terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: |
          cd "${{ env.TERRAFORM_DIR }}"
          terraform apply -auto-approve tfplan
          # safe outputs
          terraform output -json || true

